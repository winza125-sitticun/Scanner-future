name: Scanner

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: scanner-future
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v

  scan:
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      SETUP_MIN_SCORE: "75"
      AI_MIN_CONFIDENCE: "75"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .scanner_state
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-
      - run: mkdir -p .scanner_state
      - name: Run one scan cycle
        run: python run_once.py --state-file .scanner_state/recent_signals.json --limit 40
      - name: Save alert cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .scanner_state
          key: scanner-state-${{ github.run_id }}
