name: Scanner

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: scanner-future
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v

  scan:
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      SETUP_MIN_SCORE: "75"
      AI_MIN_CONFIDENCE: "75"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .scanner_state
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-
      - run: mkdir -p .scanner_state
      - name: Run one scan cycle
        run: |
          python - <<'PY'
          import requests

          probes = [
              ("BINANCE", "https://fapi.binance.com/fapi/v1/klines", {"symbol": "BTCUSDT", "interval": "1h", "limit": 2}),
              ("BYBIT", "https://api.bybit.com/v5/market/kline", {"category": "linear", "symbol": "BTCUSDT", "interval": "60", "limit": 2}),
              ("OKX", "https://www.okx.com/api/v5/market/candles", {"instId": "BTC-USDT-SWAP", "bar": "1H", "limit": 2}),
          ]
          for name, url, params in probes:
              try:
                  response = requests.get(url, params=params, timeout=8)
                  print(f"PROBE {name}: HTTP {response.status_code} {response.text[:160]!r}")
              except Exception as exc:
                  print(f"PROBE {name}: {type(exc).__name__}: {exc}")
          PY
      - name: Run one scan cycle
        run: python run_once.py --state-file .scanner_state/recent_signals.json --limit 40
      - name: Save alert cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .scanner_state
          key: scanner-state-${{ github.run_id }}
